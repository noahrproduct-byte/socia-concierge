<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* SOCIA promo: the homepage's own world. Monochrome, warm white ink, one
         warm accent (gold) for the one thing that matters in a frame, and the
         product's cobalt only inside the product's own UI. See SPEC.md. */
      @font-face { font-family: "Inter Tight"; font-weight: 500; font-style: normal; src: url("assets/fonts/inter-tight-500.woff2") format("woff2"); }
      @font-face { font-family: "Inter Tight"; font-weight: 600; font-style: normal; src: url("assets/fonts/inter-tight-600.woff2") format("woff2"); }
      @font-face { font-family: "Inter Tight"; font-weight: 700; font-style: normal; src: url("assets/fonts/inter-tight-700.woff2") format("woff2"); }
      @font-face { font-family: "Inter Tight"; font-weight: 800; font-style: normal; src: url("assets/fonts/inter-tight-800.woff2") format("woff2"); }
      :root {
        --black: #0a0a0a;
        --ink: #f2efe9;
        --ink-2: rgba(242, 239, 233, 0.66);
        --ink-3: rgba(242, 239, 233, 0.46);
        --rule: rgba(242, 239, 233, 0.14);
        --gold: #c9b27c;
        --cobalt: #2563ff;
        --app-bg: #0f0f10;
        --app-raised: rgba(255, 255, 255, 0.045);
        --app-rule: rgba(255, 255, 255, 0.1);
        --app-ink: #f5f5f6;
        --app-ink-2: rgba(245, 245, 246, 0.74);
        --app-ink-3: rgba(245, 245, 246, 0.56);
        --ok: #3fb950;
        --warn: #e5a50a;
        --bad: #f0665b;
        --font-display: "Inter Tight", Inter, sans-serif;
        --font: Inter, sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--black); }
      #root { position: relative; width: 100%; height: 100%; background: var(--black); color: var(--ink); font-family: var(--font); }

      /* ---- shared scene vocabulary (scenes are mounted into this page) ---- */
      .stage { position: absolute; inset: 0; }
      .step { position: absolute; top: 200px; left: 0; right: 0; text-align: center; font: 600 28px/1 var(--font); color: var(--ink-3); }
      .t1 { position: absolute; top: 246px; left: 60px; right: 60px; text-align: center; font: 800 88px/1.02 var(--font-display); letter-spacing: -0.03em; color: var(--ink); }
      .t2 { position: absolute; top: 342px; left: 40px; right: 40px; text-align: center; font: 800 112px/1 var(--font-display); letter-spacing: -0.035em; color: var(--gold); }
      .take { position: absolute; top: 1196px; left: 90px; right: 90px; text-align: center; font: 600 38px/1.3 var(--font); color: var(--ink); letter-spacing: -0.01em; }
      .take b { color: var(--gold); font-weight: 700; }
      .panel { position: absolute; left: 90px; width: 900px; background: var(--app-bg); border: 1.5px solid var(--app-rule); border-radius: 20px; color: var(--app-ink); overflow: hidden; }
      .panel-h { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 24px 32px; border-bottom: 1px solid var(--app-rule); }
      .panel-h h3 { font: 700 32px/1.1 var(--font); color: var(--app-ink); letter-spacing: -0.01em; }
      .panel-h span { font: 500 28px/1.1 var(--font); color: var(--app-ink-3); text-align: right; }
      .row { display: flex; align-items: center; gap: 22px; padding: 20px 32px; border-bottom: 1px solid var(--app-rule); }
      .row:last-child { border-bottom: 0; }
      .row .name { font: 600 32px/1.2 var(--font); color: var(--app-ink); letter-spacing: -0.01em; }
      .row .sub { font: 500 28px/1.25 var(--font); color: var(--app-ink-3); margin-top: 6px; }
      .grow { flex: 1; min-width: 0; }
      .chip { display: inline-block; font: 600 28px/1 var(--font); padding: 10px 14px; border-radius: 10px; background: var(--app-raised); color: var(--app-ink-2); border: 1px solid var(--app-rule); white-space: nowrap; }
      .chip.ok { color: var(--ok); border-color: rgba(63, 185, 80, 0.35); background: rgba(63, 185, 80, 0.08); }
      .chip.warn { color: var(--warn); border-color: rgba(229, 165, 10, 0.35); background: rgba(229, 165, 10, 0.08); }
      .chip.bad { color: var(--bad); border-color: rgba(240, 102, 91, 0.35); background: rgba(240, 102, 91, 0.08); }
      .chip.blue { color: #8fb3ff; border-color: rgba(37, 99, 255, 0.45); background: rgba(37, 99, 255, 0.14); }
      .chip.gold { color: var(--gold); border-color: rgba(201, 178, 124, 0.45); background: rgba(201, 178, 124, 0.1); }
      .btn { display: inline-flex; align-items: center; justify-content: center; font: 700 30px/1 var(--font); padding: 22px 34px; border-radius: 14px; background: var(--app-ink); color: var(--app-bg); }
      .btn.primary { background: var(--cobalt); color: #fff; }
      .num { font-family: var(--font-display); font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
      .mark { display: block; border-radius: 22%; }
      .pm { width: 44px; height: 44px; flex: none; color: var(--app-ink-2); }
      .pm.brand.instagram { color: #d6357a; }
      .pm.brand.youtube { color: #e0332a; }
      .pm.brand.facebook { color: #1877f2; }
      .pm.brand.tiktok { color: #0ea5b7; }
      .avatar { width: 60px; height: 60px; border-radius: 50%; flex: none; display: grid; place-items: center; font: 700 28px/1 var(--font); color: var(--app-ink); background: #2a2622; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="87" data-width="1080" data-height="1920">
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="5" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="reveal" data-composition-id="reveal" data-composition-src="compositions/reveal.html" data-start="5" data-duration="4" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="connect" data-composition-id="connect" data-composition-src="compositions/connect.html" data-start="9" data-duration="6.5" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="analytics" data-composition-id="analytics" data-composition-src="compositions/analytics.html" data-start="15.5" data-duration="6.5" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="audience" data-composition-id="audience" data-composition-src="compositions/audience.html" data-start="22" data-duration="6.5" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="competitors" data-composition-id="competitors" data-composition-src="compositions/competitors.html" data-start="28.5" data-duration="6.5" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="plan" data-composition-id="plan" data-composition-src="compositions/plan.html" data-start="35" data-duration="7" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="studio" data-composition-id="studio" data-composition-src="compositions/studio.html" data-start="42" data-duration="7" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="reels" data-composition-id="reels" data-composition-src="compositions/reels.html" data-start="49" data-duration="6" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="ask" data-composition-id="ask" data-composition-src="compositions/ask.html" data-start="55" data-duration="9" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="publish" data-composition-id="publish" data-composition-src="compositions/publish.html" data-start="64" data-duration="6" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="mcp" data-composition-id="mcp" data-composition-src="compositions/mcp.html" data-start="70" data-duration="7" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="claim" data-composition-id="claim" data-composition-src="compositions/claim.html" data-start="77" data-duration="4" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="end" data-composition-id="end" data-composition-src="compositions/end.html" data-start="81" data-duration="6" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <!-- Music slot: drop a bed into assets/audio/ and uncomment.
      <audio id="bed" class="clip" src="assets/audio/bed.mp3" data-start="5" data-duration="82" data-volume="0.6" data-fade-in="1" data-fade-out="2" data-track-index="2"></audio> -->
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
